<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Prax</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00A896;--green2:#1D9E75;--green-light:#e6f7f5;
  --bg:#f7f8fa;--card:#fff;--border:#e5e7eb;
  --text:#1a1a2e;--muted:#6b7280;--muted2:#9ca3af;
  --red:#ef4444;--red-light:#fef2f2;
  --yellow:#f59e0b;--yellow-light:#fffbeb;
  --blue:#3b82f6;--blue-light:#eff6ff;
  --purple:#8b5cf6;--purple-light:#f5f3ff;
  --orange:#f97316;--orange-light:#fff7ed;
  --radius:10px;--shadow:0 1px 4px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
input,select,textarea{font-family:inherit;font-size:14px}

/* TOPBAR */
#topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:16px;height:52px;position:sticky;top:0;z-index:100}
#logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--text)}
#logo img{width:28px;height:28px;border-radius:6px;object-fit:contain}
#lead-count{background:var(--green-light);color:var(--green2);font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px}
#topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-sm{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;color:var(--text);font-weight:500;transition:background .15s}
.btn-sm:hover{background:var(--bg)}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{background:var(--green2)}

/* TABS */
#tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:#fff;padding:0 20px;overflow-x:auto}
.tab{padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* MAIN */
#main{padding:20px;max-width:960px;margin:0 auto}

/* BANNERS */
#banners{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid transparent}
.banner-red{background:var(--red-light);color:var(--red);border-color:#fecaca}
.banner-yellow{background:var(--yellow-light);color:#92400e;border-color:#fde68a}
.banner-green{background:var(--green-light);color:var(--green2);border-color:#a7f3d0}

/* FILTERS */
#filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.chip.special{background:var(--bg)}

/* CARDS */
#cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:box-shadow .15s;border-left:4px solid transparent;position:relative}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card.border-red{border-left-color:var(--red)}
.card.border-purple{border-left-color:var(--purple)}
.card.border-yellow{border-left-color:var(--yellow)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:#fff}
.card-title{flex:1;min-width:0}
.card-empresa{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-sub{font-size:12px;color:var(--muted);margin-top:1px}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-status-Novo{background:#f0fdf4;color:#166534}
.badge-status-Contatado{background:#eff6ff;color:#1e40af}
.badge-status-Respondeu{background:#fdf4ff;color:#7e22ce}
.badge-status-Qualificado{background:#fff7ed;color:#9a3412}
.badge-status-Parceiro{background:var(--green-light);color:var(--green2)}
.badge-status-Sem{background:#f9fafb;color:#6b7280}
.badge-status-Nutrir{background:#fefce8;color:#854d0e}
.badge-canal-wa{background:#dcfce7;color:#166534}
.badge-canal-ig{background:var(--orange-light);color:#9a3412}
.badge-canal-li{background:var(--blue-light);color:#1e40af}
.badge-canal-dm{background:var(--purple-light);color:#5b21b6}
.badge-ready-green{background:var(--green-light);color:var(--green2)}
.badge-ready-yellow{background:var(--yellow-light);color:#92400e}
.badge-ready-red{background:var(--red-light);color:#991b1b}
.badge-warn{background:var(--yellow-light);color:#92400e}
.badge-gancho{background:#f0fdf4;color:#166534}
.badge-missing{background:var(--orange-light);color:#9a3412;font-size:11px}

.progress-bar{height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;border-radius:2px;transition:width .3s}
.progress-green{background:var(--green)}
.progress-yellow{background:var(--yellow)}
.progress-red{background:var(--red)}

.card-follows{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.follow-item{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:var(--bg)}
.follow-vencido{background:var(--red-light);color:var(--red)}
.follow-hoje{background:var(--yellow-light);color:#92400e}
.follow-futuro{background:var(--bg);color:var(--muted)}
.card-preview{font-size:12px;color:var(--muted);margin-top:6px;border-top:1px solid var(--border);padding-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* DETAIL VIEW */
#detail-view{display:none;padding:20px;max-width:960px;margin:0 auto}
.detail-back{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:16px}
.detail-back:hover{color:var(--text)}
.detail-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.detail-section-title{font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px 0}
.detail-body{padding:12px 16px 16px}
.field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field-label{font-size:11px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em}
.field-input{border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;width:100%;background:#fff;transition:border .15s}
.field-input:focus{outline:none;border-color:var(--green)}
.field-with-link{display:flex;gap:6px;align-items:center}
.field-with-link .field-input{flex:1}
.field-link{font-size:12px;white-space:nowrap;padding:4px 8px;border-radius:5px;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text);transition:background .15s}
.field-link:hover{background:var(--green-light);color:var(--green)}
.validate-btn{padding:5px 10px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.validate-btn.not-validated{background:var(--yellow-light);color:#92400e;border-color:#fde68a}
.validate-btn.validated{background:var(--green-light);color:var(--green2);border-color:#a7f3d0}

.checklist-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg)}
.checklist-item:last-child{border-bottom:none}
.check-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.check-ok{background:var(--green-light);color:var(--green)}
.check-no{background:#f3f4f6;color:var(--muted2)}
.check-label{font-size:13px;flex:1}
.check-weight{font-size:11px;color:var(--muted2)}

.canal-btns{display:flex;gap:8px;flex-wrap:wrap}
.canal-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.canal-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.canal-btn.active-wa{background:#dcfce7;color:#166534;border-color:#86efac}
.canal-btn.active-ig{background:var(--orange-light);color:#9a3412;border-color:#fed7aa}
.canal-btn.active-li{background:var(--blue-light);color:#1e40af;border-color:#bfdbfe}
.canal-btn.active-dm{background:var(--purple-light);color:#5b21b6;border-color:#ddd6fe}
.canal-btn.active-none{background:#f3f4f6;color:var(--muted);border-color:var(--border)}
.canal-btn:disabled{opacity:.4;cursor:not-allowed}

.follow-canal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg)}
.follow-canal-row:last-child{border-bottom:none}
.follow-canal-label{font-size:12px;font-weight:600;width:80px;color:var(--muted)}
.follow-canal-dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1}
.follow-date-input{border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:12px;width:130px}
.follow-date-input.vencido{border-color:var(--red);background:var(--red-light)}
.follow-date-input.hoje{border-color:var(--yellow);background:var(--yellow-light)}

.hist-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg);font-size:12px;align-items:flex-start}
.hist-item:last-child{border-bottom:none}
.hist-canal{width:30px;text-align:center;font-size:11px}
.hist-date{color:var(--muted2);white-space:nowrap}
.hist-note{flex:1;color:var(--text)}

.comment-item{padding:8px;background:var(--bg);border-radius:6px;margin-bottom:6px;font-size:13px}
.comment-date{font-size:11px;color:var(--muted2);margin-bottom:2px}

.action-bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:#f9fafb}
.btn-action{padding:8px 16px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-action:hover{background:var(--bg)}
.btn-action.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-action.green:hover{background:var(--green2)}
.btn-action.danger{color:var(--red);border-color:#fecaca}
.btn-action.danger:hover{background:var(--red-light)}

/* PRONTOS TAB */
.prontos-section{margin-bottom:24px}
.prontos-section-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.empty-state{text-align:center;padding:32px;color:var(--muted);font-size:14px}

/* ALERTAS TAB */
.alertas-group{margin-bottom:20px}
.alertas-group-title{font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.alerta-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;gap:10px;align-items:center;cursor:pointer}
.alerta-item:hover{border-color:var(--green)}
.alerta-info{flex:1}
.alerta-empresa{font-weight:600;font-size:13px}
.alerta-meta{font-size:12px;color:var(--muted)}
.alerta-date{font-size:12px;font-weight:600}
.alerta-date.vencido{color:var(--red)}
.alerta-date.hoje{color:var(--yellow)}
.alerta-date.proximo{color:var(--green)}

/* WEEKLY TAB */
.weekly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.weekly-stat{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.weekly-stat-num{font-size:28px;font-weight:800;color:var(--green)}
.weekly-stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.weekly-stat-sub{font-size:11px;color:var(--muted2);margin-top:2px}
.weekly-chart{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.chart-bars{display:flex;gap:8px;align-items:flex-end;height:100px;margin-top:12px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.chart-label{font-size:10px;color:var(--muted);text-align:center}
.chart-val{font-size:10px;font-weight:600;color:var(--text)}
.weekly-btns{display:flex;gap:8px;margin-bottom:20px}

/* PROSPECTAR TAB */
.prospectar-info{background:var(--blue-light);border:1px solid #bfdbfe;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#1e40af}
.prospectar-nota{background:var(--yellow-light);border:1px solid #fde68a;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#92400e}
.sessao-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:20px}
.sessao-btn{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:500;text-align:left;transition:all .15s;line-height:1.4}
.sessao-btn:hover{border-color:var(--green);background:var(--green-light)}
.sessao-btn span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.import-area{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px}
.import-area h4{font-size:13px;font-weight:700;margin-bottom:8px}
.import-area p{font-size:12px;color:var(--muted);margin-bottom:8px}
.import-textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;font-family:monospace;resize:vertical;min-height:100px}
.import-result{font-size:13px;margin-top:8px;padding:8px;border-radius:6px}
.import-ok{background:var(--green-light);color:var(--green2)}
.import-err{background:var(--red-light);color:var(--red)}

/* NOVO FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field.full{grid-column:1/-1}
.form-label{font-size:11px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em}
.form-input{border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;width:100%}
.form-input:focus{outline:none;border-color:var(--green)}
select.form-input{background:#fff}

/* PROMPT MODAL */
#prompt-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
#prompt-modal.show{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto}
.modal-title{font-weight:700;font-size:16px;margin-bottom:12px}
.modal-textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:13px;font-family:monospace;resize:vertical;min-height:180px;margin-bottom:12px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end}

/* RESPONSIVE */
@media(max-width:600px){
  #main,#detail-view{padding:12px}
  .form-grid{grid-template-columns:1fr}
  .form-field.full{grid-column:1}
  .weekly-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">
    <!-- Logo Prax: X branco em fundo roxo -->
    <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="6" fill="#7C3AED"/>
      <path d="M8 8 L13.5 14 L8 20 L10.5 20 L14 15.8 L17.5 20 L20 20 L14.5 14 L20 8 L17.5 8 L14 12.2 L10.5 8 Z" fill="white"/>
    </svg>
    CRM Prax
  </div>
  <span id="lead-count">0 leads</span>
  <div id="topbar-right">
    <button class="btn-sm" onclick="exportarDados()">&#8595; Exportar</button>
    <label class="btn-sm" style="cursor:pointer">&#8593; Importar <input type="file" accept=".json" style="display:none" onchange="importarDados(this)"></label>
    <button class="btn-sm" onclick="reloadFromStorage()">&#8635; Recarregar</button>
    <button class="btn-sm btn-primary" onclick="showTab('novo')">+ Novo Lead</button>
  </div>
</div>

<div id="tabs">
  <div class="tab active" data-tab="pipeline" onclick="showTab('pipeline')">Pipeline</div>
  <div class="tab" data-tab="prontos" onclick="showTab('prontos')">&#10003; Prontos</div>
  <div class="tab" data-tab="alertas" onclick="showTab('alertas')">Alertas</div>
  <div class="tab" data-tab="weekly" onclick="showTab('weekly')">Weekly</div>
  <div class="tab" data-tab="prospectar" onclick="showTab('prospectar')">Prospectar</div>
  <div class="tab" data-tab="novo" onclick="showTab('novo')">+ Novo</div>
</div>

<!-- PIPELINE -->
<div id="tab-pipeline" class="tab-content">
  <div id="main">
    <div id="banners"></div>
    <div id="filters"></div>
    <div id="cards"></div>
  </div>
</div>

<!-- PRONTOS -->
<div id="tab-prontos" class="tab-content" style="display:none">
  <div id="main" style="max-width:960px;margin:0 auto;padding:20px">
    <div id="prontos-content"></div>
  </div>
</div>

<!-- ALERTAS -->
<div id="tab-alertas" class="tab-content" style="display:none">
  <div style="max-width:960px;margin:0 auto;padding:20px" id="alertas-content"></div>
</div>

<!-- WEEKLY -->
<div id="tab-weekly" class="tab-content" style="display:none">
  <div style="max-width:960px;margin:0 auto;padding:20px" id="weekly-content"></div>
</div>

<!-- PROSPECTAR -->
<div id="tab-prospectar" class="tab-content" style="display:none">
  <div style="max-width:960px;margin:0 auto;padding:20px" id="prospectar-content"></div>
</div>

<!-- NOVO -->
<div id="tab-novo" class="tab-content" style="display:none">
  <div style="max-width:600px;margin:0 auto;padding:20px">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Novo Lead</h3>
    <div id="novo-form-content"></div>
  </div>
</div>

<!-- DETAIL VIEW -->
<div id="detail-view">
  <div class="detail-back" onclick="closeDetail()">&#8592; Voltar ao Pipeline</div>
  <div id="detail-content"></div>
</div>

<!-- PROMPT MODAL -->
<div id="prompt-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Prompt gerado</div>
    <textarea class="modal-textarea" id="modal-text" readonly></textarea>
    <div class="modal-footer">
      <button class="btn-sm" onclick="copyPrompt()">Copiar</button>
      <button class="btn-sm btn-primary" onclick="closeModal()">Fechar</button>
    </div>
  </div>
</div>

<script>
// ==================== DATA ====================
let leads = [];
let activeTab = 'pipeline';
let pipelineFilter = 'Todos';
let pipelineExtras = [];
let currentDetailId = null;

const SEGMENTOS = ['Ag\u00EAncia e-commerce','Consultoria','Gestor solo','Ag\u00EAncia performance','Outro'];
const STATUS_LIST = ['Novo','Contatado','Respondeu','Qualificado','Parceiro','Sem interesse','Nutrir'];
const CANAIS = ['wa','ig','li','dm'];
const CANAL_LABELS = {wa:'WhatsApp',ig:'Instagram',li:'LinkedIn',dm:'Outro DM'};
const CANAL_ICONS = {wa:'WA',ig:'IG',li:'LI',dm:'DM'};

const AVATAR_COLORS = ['#00A896','#1D9E75','#8b5cf6','#f59e0b','#ef4444','#3b82f6','#f97316','#06b6d4'];

function avatarColor(name){
  let h=0; for(let c of name) h=(h*31+c.charCodeAt(0))%AVATAR_COLORS.length;
  return AVATAR_COLORS[h];
}
function initials(name){
  if(!name) return '?';
  return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function today(){ return new Date().toISOString().split('T')[0]; }
function addDays(date,n){
  const d = new Date(date); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0];
}
function daysDiff(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr); const t = new Date(today());
  return Math.round((d-t)/(1000*60*60*24));
}
function formatDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}`;
}
function isoToWeekStart(dateStr){
  const d = new Date(dateStr);
  const day = d.getDay();
  const diff = (day===0)?-6:1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().split('T')[0];
}

// ==================== READINESS ====================
function readinessScore(lead){
  const items = [
    {label:'Decisor mapeado', ok: !!(lead.contato && lead.cargo), weight: 1},
    {label:'Canal dispon\u00EDvel', ok: !!(lead.wa||lead.ig_decisor||lead.li_decisor), weight: 1},
    {label:'Instagram validado', ok: !!(lead.ig_decisor && lead.ig_validado), weight: 1},
    {label:'LinkedIn validado', ok: !!(lead.li_decisor && lead.li_validado), weight: 1},
    {label:'Contexto preenchido', ok: !!(lead.contexto && lead.contexto.length>10), weight: 1},
    {label:'Gancho de abordagem', ok: !!(lead.gancho && lead.gancho.length>5), weight: 1},
  ];
  const score = Math.round(items.filter(i=>i.ok).length / items.length * 100);
  return {score, items};
}

function qualityScore(lead){
  let s = 0;
  if(lead.wa) s+=15;
  if(lead.ig_decisor) s+=10;
  if(lead.li_decisor) s+=10;
  if(lead.ig_validado) s+=8;
  if(lead.li_validado) s+=8;
  if(lead.contato) s+=5;
  if(lead.cargo) s+=5;
  if(lead.contexto && lead.contexto.length>10) s+=8;
  if(lead.gancho && lead.gancho.length>5) s+=10;
  if(lead.canal_ativo) s+=5;
  if(lead.pot) s+=lead.pot*3;
  if(lead.follows>0) s+=5;
  if(lead.comments && lead.comments.length>1) s+=5;
  if(['Respondeu','Qualificado','Parceiro'].includes(lead.status)) s+=10;
  return Math.min(100,s);
}

function canalSugerido(lead){
  if(lead.wa) return {canal:'wa', reason:'n\u00FAmero dispon\u00EDvel'};
  if(lead.seg==='Gestor solo' && lead.ig_decisor) return {canal:'ig', reason:'gestor solo'};
  if(lead.li_decisor) return {canal:'li', reason:'ag\u00EAncia \u2014 abordagem profissional'};
  if(lead.ig_decisor) return {canal:'ig', reason:'canal dispon\u00EDvel'};
  return null;
}

// ==================== NEXT FOLLOW ====================
function nextFollowInfo(lead){
  let urgent = null;
  CANAIS.forEach(c=>{
    const cf = lead.canal_follows && lead.canal_follows[c];
    if(cf && cf.proximo){
      const diff = daysDiff(cf.proximo);
      if(!urgent || diff < urgent.diff){
        urgent = {canal:c, date:cf.proximo, diff};
      }
    }
  });
  return urgent;
}

function allFollows(lead){
  return CANAIS.map(c=>{
    const cf = lead.canal_follows && lead.canal_follows[c];
    if(cf && cf.proximo) return {canal:c, date:cf.proximo, diff:daysDiff(cf.proximo), ultimo:cf.ultimo};
    return null;
  }).filter(Boolean);
}

function save(){

}

function load(){
  const raw = localStorage.getItem('prax_crm_data');
  if(raw){
    try{
      const d = JSON.parse(raw);
      leads = d.leads||[];
      activeTab = d.tab||'pipeline';
    }catch(e){ leads=[]; }
  } else {
    leads = sampleData();
    save();
  }
  document.getElementById('lead-count').textContent = `${leads.length} lead${leads.length!==1?'s':''}`;
}

function reloadFromStorage(){
  load(); renderAll(); showTab(activeTab);
}

// ==================== RENDER PIPELINE ====================
function renderPipeline(){
  const bannerEl = document.getElementById('banners');
  const filtersEl = document.getElementById('filters');
  const cardsEl = document.getElementById('cards');

  const vencidos = leads.filter(l=>allFollows(l).some(f=>f.diff<0));
  const validar = leads.filter(l=>(l.ig_decisor && !l.ig_validado)||(l.li_decisor && !l.li_validado));
  const novos = leads.filter(l=>l.status==='Novo');
  let bannersHtml = '';
  if(vencidos.length) bannersHtml += `<div class="banner banner-red" onclick="showTab('alertas')">&#9888; ${vencidos.length} follow-up${vencidos.length>1?'s':''} vencido${vencidos.length>1?'s':''} &mdash; ver alertas</div>`;
  if(validar.length) bannersHtml += `<div class="banner banner-yellow" onclick="setExtraFilter('Validar perfis')">&#9888; ${validar.length} perfil${validar.length>1?'is':''} para validar</div>`;
  if(novos.length < 5) bannersHtml += `<div class="banner banner-green" onclick="showTab('prospectar')">&#43; Apenas ${novos.length} leads novos &mdash; prospectar agora</div>`;
  bannerEl.innerHTML = bannersHtml;

  const counts = {};
  STATUS_LIST.forEach(s => counts[s] = leads.filter(l=>l.status===s).length);
  const total = leads.length;
  let filtersHtml = `<div class="chip ${pipelineFilter==='Todos'?'active':''}" onclick="setFilter('Todos')">Todos (${total})</div>`;
  STATUS_LIST.forEach(s=>{
    if(counts[s]) filtersHtml += `<div class="chip ${pipelineFilter===s?'active':''}" onclick="setFilter('${s}')">${s} (${counts[s]})</div>`;
  });
  const extras = ['Validar perfis','Sem gancho','WA ativo','IG ativo','LI ativo'];
  extras.forEach(e=>{
    filtersHtml += `<div class="chip special ${pipelineExtras.includes(e)?'active':''}" onclick="toggleExtra('${e}')">${e}</div>`;
  });
  filtersEl.innerHTML = filtersHtml;

  let filtered = leads.filter(l=>{
    if(pipelineFilter!=='Todos' && l.status!==pipelineFilter) return false;
    if(pipelineExtras.includes('Validar perfis') && !((l.ig_decisor&&!l.ig_validado)||(l.li_decisor&&!l.li_validado))) return false;
    if(pipelineExtras.includes('Sem gancho') && l.gancho && l.gancho.length>5) return false;
    if(pipelineExtras.includes('WA ativo') && l.canal_ativo!=='wa') return false;
    if(pipelineExtras.includes('IG ativo') && l.canal_ativo!=='ig') return false;
    if(pipelineExtras.includes('LI ativo') && l.canal_ativo!=='li') return false;
    return true;
  });

  filtered.sort((a,b)=>{
    const endStatus = ['Parceiro','Sem interesse'];
    const ae = endStatus.includes(a.status), be = endStatus.includes(b.status);
    if(ae && !be) return 1;
    if(!ae && be) return -1;
    const af = nextFollowInfo(a), bf = nextFollowInfo(b);
    if(af && bf) return af.diff - bf.diff;
    if(af) return -1;
    if(bf) return 1;
    return b.id - a.id;
  });

  let html = '';
  if(!filtered.length){
    html = '<div class="empty-state">Nenhum lead encontrado</div>';
  } else {
    filtered.forEach(lead=>{ html += renderCard(lead); });
  }
  cardsEl.innerHTML = html;
}

function renderCard(lead){
  const {score, items} = readinessScore(lead);
  const follows = allFollows(lead);
  const needsValidate = (lead.ig_decisor&&!lead.ig_validado)||(lead.li_decisor&&!lead.li_validado);
  const sugg = canalSugerido(lead);

  let borderClass = '';
  const hasVencido = follows.some(f=>f.diff<0);
  if(hasVencido) borderClass = 'border-red';
  else if(score>=80 && lead.status==='Novo') borderClass = 'border-purple';
  else if(needsValidate) borderClass = 'border-yellow';

  let readyBadge='';
  if(score>=80) readyBadge=`<span class="badge badge-ready-green">&#10003; Pronto</span>`;
  else if(score>=40) readyBadge=`<span class="badge badge-ready-yellow">~ Quase</span>`;
  else readyBadge=`<span class="badge badge-ready-red">Incompleto</span>`;

  const progressClass = score>=80?'progress-green':score>=40?'progress-yellow':'progress-red';

  const statusKey = lead.status==='Sem interesse'?'Sem':lead.status;
  const statusBadge = `<span class="badge badge-status-${statusKey}">${lead.status}</span>`;

  let canalBadge='';
  if(lead.canal_ativo) canalBadge=`<span class="badge badge-canal-${lead.canal_ativo}">${CANAL_ICONS[lead.canal_ativo]} ${CANAL_LABELS[lead.canal_ativo]}</span>`;

  let followsHtml='';
  if(follows.length){
    followsHtml = '<div class="card-follows">';
    follows.forEach(f=>{
      let cls='follow-futuro', label='';
      if(f.diff<0){cls='follow-vencido';label=`${CANAL_ICONS[f.canal]} ${CANAL_LABELS[f.canal]}: vencido ${-f.diff}d`;}
      else if(f.diff===0){cls='follow-hoje';label=`${CANAL_ICONS[f.canal]} ${CANAL_LABELS[f.canal]}: hoje`;}
      else{label=`${CANAL_ICONS[f.canal]} ${CANAL_LABELS[f.canal]}: ${f.diff}d`;}
      followsHtml+=`<span class="follow-item ${cls}">${label}</span>`;
    });
    followsHtml+='</div>';
  }

  let suggHtml='';
  if(!lead.canal_ativo && sugg) suggHtml=`<span class="badge badge-canal-${sugg.canal}" style="opacity:.7">&#8594; ${CANAL_LABELS[sugg.canal]}</span>`;

  let validateHtml='';
  if(needsValidate) validateHtml=`<span class="badge badge-warn">&#9888; validar</span>`;

  let ganchoHtml='';
  if(lead.gancho && lead.gancho.length>5) ganchoHtml=`<span class="badge badge-gancho">gancho &#10003;</span>`;

  let preview = lead.gancho||lead.contexto||(lead.comments.length?lead.comments[lead.comments.length-1].text:'')||'';
  let previewHtml = preview ? `<div class="card-preview">${preview}</div>` : '';

  return `<div class="card ${borderClass}" onclick="openDetail(${lead.id})">
    <div class="card-header">
      <div class="avatar" style="background:${avatarColor(lead.nome)}">${initials(lead.nome)}</div>
      <div class="card-title">
        <div class="card-empresa">${lead.nome} ${statusBadge}</div>
        <div class="card-sub">${lead.contato||'<em>sem contato</em>'} ${lead.cargo?'&middot; '+lead.cargo:''} ${lead.cidade?'&middot; '+lead.cidade:''}</div>
      </div>
      ${readyBadge}
    </div>
    <div class="progress-bar"><div class="progress-fill ${progressClass}" style="width:${score}%"></div></div>
    <div class="card-meta">
      ${canalBadge}${suggHtml}${validateHtml}${ganchoHtml}
    </div>
    ${followsHtml}
    ${previewHtml}
  </div>`;
}

function setFilter(f){
  pipelineFilter = f;
  pipelineExtras = [];
  renderPipeline();
}
function toggleExtra(e){
  if(pipelineExtras.includes(e)) pipelineExtras=pipelineExtras.filter(x=>x!==e);
  else pipelineExtras.push(e);
  renderPipeline();
}
function setExtraFilter(e){
  showTab('pipeline');
  pipelineExtras = [e];
  renderPipeline();
}

// ==================== DETAIL VIEW ====================
function openDetail(id){
  currentDetailId = id;
  document.getElementById('tab-pipeline').style.display='none';
  document.getElementById('detail-view').style.display='block';
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.remove('active'));
  renderDetail(id);
}

function closeDetail(){
  currentDetailId = null;
  document.getElementById('detail-view').style.display='none';
  document.getElementById('tab-pipeline').style.display='block';
  document.querySelectorAll('#tabs .tab').forEach(t=>{
    if(t.dataset.tab==='pipeline') t.classList.add('active');
  });
  renderPipeline();
}

        <div style="flex:1"><div class="progress-bar" style="height:8px"><div class="progress-fill ${progressClass}" style="width:${score}%"></div></div></div>
        <div style="font-weight:700;font-size:18px;color:${score>=80?'var(--green)':score>=40?'var(--yellow)':'var(--red)'}">${score}%</div>
        <div style="font-size:11px;color:var(--muted)">qualidade: ${qualScore}</div>
      </div>
      ${items.map(item=>`
        <div class="checklist-item">
          <div class="check-icon ${item.ok?'check-ok':'check-no'}">${item.ok?'&#10003;':'&#9675;'}</div>
          <div class="check-label">${item.label}</div>
        </div>
      `).join('')}
      ${sugg?`<div style="margin-top:10px;font-size:13px;color:var(--muted)">Canal sugerido: <strong>${CANAL_LABELS[sugg.canal]}</strong> <span style="color:var(--muted2)">(${sugg.reason})</span></div>`:''}
    </div>
  </div>`;

  // GANCHO
  html += `<div class="detail-card">
    <div class="detail-section-title">Gancho</div>
    <div class="detail-body">
      <div class="field-row">
        <div class="field-label">Post recente / dado para DM n\u00E3o gen\u00E9rica</div>
        <textarea class="field-input" rows="3" onblur="updateField(${id},'gancho',this.value)" style="resize:vertical">${esc(lead.gancho)}</textarea>
      </div>
      <button class="btn-action" onclick="gerarMensagem(${id})">Gerar mensagem com gancho &#8594;</button>
    </div>
  </div>`;

  // CANAL ATIVO
  const canalBtns = ['wa','ig','li','dm','none'].map(c=>{
    let disabled = false;
    if(c==='wa' && !lead.wa) disabled=true;
    if(c==='ig' && !lead.ig_decisor) disabled=true;
    if(c==='li' && !lead.li_decisor) disabled=true;
    const isActive = (c==='none' && !lead.canal_ativo) || lead.canal_ativo===c;
    const label = c==='none'?'Nenhum':CANAL_LABELS[c];
    return `<button class="canal-btn ${isActive?'active-'+c:''}" onclick="setCanalAtivo(${id},'${c==='none'?'':c}')" ${disabled&&c!=='none'?'disabled':''}>${CANAL_ICONS[c]||''} ${label}</button>`;
  });
  html += `<div class="detail-card">
    <div class="detail-section-title">Canal Ativo</div>
    <div class="detail-body">
      <div class="canal-btns">${canalBtns.join('')}</div>
    </div>
  </div>`;

  // FOLLOW POR CANAL
  const canalComDados = CANAIS.filter(c=>{
    if(c==='wa') return !!lead.wa;
    if(c==='ig') return !!lead.ig_decisor;
    if(c==='li') return !!lead.li_decisor;
    return true;
  });
  if(canalComDados.length){
    html += `<div class="detail-card">
      <div class="detail-section-title">Follow por Canal</div>
      <div class="detail-body">`;
    canalComDados.forEach(c=>{
      const cf = lead.canal_follows && lead.canal_follows[c] ? lead.canal_follows[c] : {};
      const proxDiff = cf.proximo ? daysDiff(cf.proximo) : null;
      const dateClass = proxDiff===null?'':(proxDiff<0?'vencido':proxDiff===0?'hoje':'');
      html+=`<div class="follow-canal-row">
        <div class="follow-canal-label">${CANAL_ICONS[c]} ${CANAL_LABELS[c]}</div>
        <div class="follow-canal-dates">
          <span style="font-size:12px;color:var(--muted2)">\u00DAltimo: ${cf.ultimo?formatDate(cf.ultimo):'&mdash;'}</span>
          <span style="font-size:12px;color:var(--muted2)">Pr\u00F3ximo:</span>
          <input type="date" class="follow-date-input ${dateClass}" value="${cf.proximo||''}" onchange="updateCanalFollow(${id},'${c}','proximo',this.value)">
          ${proxDiff!==null&&proxDiff<0?`<span style="font-size:11px;color:var(--red);font-weight:600">vencido ${-proxDiff}d</span>`:''}
          ${proxDiff===0?`<span style="font-size:11px;color:var(--yellow);font-weight:600">hoje!</span>`:''}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // HISTORICO
  html += `<div class="detail-card">
    <div class="detail-section-title">Hist\u00F3rico de Canais</div>
    <div class="detail-body">
      <div id="hist-list-${id}">`;
  if(lead.canal_hist && lead.canal_hist.length){
    [...lead.canal_hist].reverse().forEach(h=>{
      html+=`<div class="hist-item">
        <div class="hist-canal">${CANAL_ICONS[h.canal]||h.canal}</div>
        <div class="hist-date">${formatDate(h.data)}</div>
        <div class="hist-note">${esc(h.nota)}</div>
      </div>`;
    });
  } else {
    html+='<div style="font-size:13px;color:var(--muted2)">Sem hist\u00F3rico ainda.</div>';
  }
  html+=`</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <input id="nota-input-${id}" class="field-input" style="flex:1" placeholder="Adicionar nota...">
        <button class="btn-sm" onclick="addHistNota(${id})">Adicionar</button>
      </div>
    </div>
  </div>`;

  // METADADOS
  html += `<div class="detail-card">
    <div class="detail-section-title">Metadados</div>
    <div class="detail-body">
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px">
        <div><span style="color:var(--muted2)">Fonte:</span> ${lead.fonte||'&mdash;'}</div>
        <div><span style="color:var(--muted2)">1\u00BA contato:</span> ${lead.data1?formatDate(lead.data1):'&mdash;'}</div>
        <div><span style="color:var(--muted2)">\u00DAltimo:</span> ${lead.ultimo?formatDate(lead.ultimo):'&mdash;'}</div>
        <div><span style="color:var(--muted2)">Follows:</span> ${lead.follows||0}</div>
      </div>
    </div>
  </div>`;

  // STATUS
  html += `<div class="detail-card">
    <div class="detail-section-title">Status</div>
    <div class="detail-body">
      <select class="form-input" style="max-width:200px" onchange="updateField(${id},'status',this.value)">
        ${STATUS_LIST.map(s=>`<option ${lead.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
  </div>`;

  // COMENTARIOS
  html += `<div class="detail-card">
    <div class="detail-section-title">Coment\u00E1rios</div>
    <div class="detail-body">
      <div id="comments-list-${id}">`;
  if(lead.comments && lead.comments.length){
    [...lead.comments].reverse().forEach(c=>{
      html+=`<div class="comment-item"><div class="comment-date">${formatDate(c.date)}</div>${esc(c.text)}</div>`;
    });
  } else {
    html+='<div style="font-size:13px;color:var(--muted2)">Sem coment\u00E1rios.</div>';
  }
  html+=`</div>
      <div style="margin-top:10px">
        <textarea id="comment-input-${id}" class="field-input" rows="2" placeholder="Novo coment\u00E1rio..." style="resize:vertical;margin-bottom:6px"></textarea>
        <button class="btn-sm" onclick="addComment(${id})">Adicionar coment\u00E1rio</button>
      </div>
    </div>
  </div>`;

  // ACOES
  html += `<div class="action-bar">
    <button class="btn-action green" onclick="followEnviado(${id})">+ Follow enviado</button>
    <button class="btn-action" onclick="gerarMensagem(${id})">Gerar mensagem &#8594;</button>
    <button class="btn-action danger" onclick="removeLead(${id})">Remover lead</button>
  </div>`;

  document.getElementById('detail-content').innerHTML = html;
}

// ==================== DETAIL ACTIONS ====================
function updateField(id, field, value){
  const lead = getLead(id);
  if(!lead) return;
  lead[field] = value;
  if(field==='ig_decisor' && !value) lead.ig_validado = false;
  if(field==='li_decisor' && !value) lead.li_validado = false;
  save();
  renderDetail(id);
}

function updateCanalFollow(id, canal, field, value){
  const lead = getLead(id);
  if(!lead.canal_follows) lead.canal_follows = {};
  if(!lead.canal_follows[canal]) lead.canal_follows[canal] = {};
  lead.canal_follows[canal][field] = value;
  save();
}

function toggleValidate(id, tipo){
  const lead = getLead(id);
  if(tipo==='ig') lead.ig_validado = !lead.ig_validado;
  else lead.li_validado = !lead.li_validado;
  save();
  renderDetail(id);
}

function setCanalAtivo(id, canal){
  const lead = getLead(id);
  const prev = lead.canal_ativo;
  lead.canal_ativo = canal || null;
  if(canal && canal!==prev){
    if(!lead.canal_hist) lead.canal_hist = [];
    lead.canal_hist.push({canal, data:today(), nota:`Canal ativo alterado para ${CANAL_LABELS[canal]}.`});
  }
  save();
  renderDetail(id);
}

function addHistNota(id){
  const input = document.getElementById(`nota-input-${id}`);
  const nota = input.value.trim();
  if(!nota) return;
  const lead = getLead(id);
  if(!lead.canal_hist) lead.canal_hist = [];
  const canal = lead.canal_ativo || 'dm';
  lead.canal_hist.push({canal, data:today(), nota});
  input.value = '';
  save();
  renderDetail(id);
}

function addComment(id){
  const input = document.getElementById(`comment-input-${id}`);
  const text = input.value.trim();
  if(!text) return;
  const lead = getLead(id);
  if(!lead.comments) lead.comments = [];
  lead.comments.push({date:today(), text});
  input.value = '';
  save();
  renderDetail(id);
}

function followEnviado(id){
  const lead = getLead(id);
  lead.follows = (lead.follows||0) + 1;
  lead.ultimo = today();
  if(!lead.data1) lead.data1 = today();
  if(lead.canal_ativo){
    const c = lead.canal_ativo;
    if(!lead.canal_follows) lead.canal_follows = {};
    if(!lead.canal_follows[c]) lead.canal_follows[c] = {};
    lead.canal_follows[c].ultimo = today();
    const followCount = lead.follows;
    let nextDays = followCount<=1?2:followCount<=2?5:10;
    lead.canal_follows[c].proximo = addDays(today(), nextDays);
    if(!lead.canal_hist) lead.canal_hist = [];
    lead.canal_hist.push({canal:c, data:today(), nota:`Follow #${lead.follows} enviado.`});
  }
  if(!lead.comments) lead.comments = [];
  lead.comments.push({date:today(), text:`Follow #${lead.follows} enviado via ${lead.canal_ativo?CANAL_LABELS[lead.canal_ativo]:'canal desconhecido'}.`});
  save();
  renderDetail(id);
}

function removeLead(id){
  if(!confirm('Remover este lead? Esta a\u00E7\u00E3o n\u00E3o pode ser desfeita.')) return;
  leads = leads.filter(l=>l.id!==id);
  save();
  closeDetail();
}

function gerarMensagem(id){
  const lead = getLead(id);
  const sugg = canalSugerido(lead);
  const canal = lead.canal_ativo ? CANAL_LABELS[lead.canal_ativo] : (sugg?CANAL_LABELS[sugg.canal]:'a definir');
  const prompt = `Mensagem de primeiro contato para: ${lead.contato||'[decisor]'}, ${lead.cargo||'[cargo]'} da ${lead.nome}.\nCanal: ${canal}.\nGancho: ${lead.gancho||'(sem gancho definido)'}.\nContexto: ${lead.contexto||'(sem contexto)'}.\nTom pr\u00F3ximo, n\u00E3o gen\u00E9rico, m\u00E1x 4 linhas.`;
  showModal('Prompt: Gerar Mensagem', prompt);
}

// ==================== PRONTOS TAB ====================
function renderProntos(){
  const prontos = leads.filter(l=>l.status==='Novo' && readinessScore(l).score>=80);
  const quase = leads.filter(l=>l.status==='Novo' && readinessScore(l).score>=40 && readinessScore(l).score<80);
  let html = '';
  html += `<div class="prontos-section">
    <div class="prontos-section-title">&#10003; Prontos para contatar <span style="font-size:13px;color:var(--muted)">(${prontos.length})</span></div>`;
  if(!prontos.length) html += '<div class="empty-state">Nenhum lead pronto ainda.</div>';
  else prontos.forEach(l=>{ html+=renderCard(l); });
  html += `</div>`;

  html += `<div class="prontos-section">
    <div class="prontos-section-title">~ Quase prontos <span style="font-size:13px;color:var(--muted)">(${quase.length})</span></div>`;
  if(!quase.length) html += '<div class="empty-state">Nenhum lead quase pronto.</div>';
  else quase.forEach(l=>{
    const {items} = readinessScore(l);
    const faltam = items.filter(i=>!i.ok).map(i=>`<span class="badge-missing badge">${i.label}</span>`).join(' ');
    html+=`<div onclick="openDetail(${l.id})" style="cursor:pointer">${renderCard(l)}<div style="padding:0 14px 10px;display:flex;gap:4px;flex-wrap:wrap;font-size:11px">${faltam}</div></div>`;
  });
  html += '</div>';

  document.getElementById('prontos-content').innerHTML = html;
}

// ==================== ALERTAS TAB ====================
function renderAlertas(){
  const allF = [];
  leads.forEach(l=>{
    allFollows(l).forEach(f=>{ allF.push({lead:l, ...f}); });
  });
  const vencidos = allF.filter(f=>f.diff<0).sort((a,b)=>a.diff-b.diff);
  const hoje = allF.filter(f=>f.diff===0);
  const proximos = allF.filter(f=>f.diff>0 && f.diff<=3).sort((a,b)=>a.diff-b.diff);

  const renderGroup = (title, items, color) => {
    if(!items.length) return '';
    return `<div class="alertas-group">
      <div class="alertas-group-title" style="color:${color}">${title} (${items.length})</div>
      ${items.map(f=>`
        <div class="alerta-item" onclick="openDetail(${f.lead.id})">
          <div style="font-size:16px;font-weight:700">${CANAL_ICONS[f.canal]}</div>
          <div class="alerta-info">
            <div class="alerta-empresa">${f.lead.nome}</div>
            <div class="alerta-meta">${f.lead.contato||'&mdash;'} &middot; ${CANAL_LABELS[f.canal]}</div>
          </div>
          <div class="alerta-date ${f.diff<0?'vencido':f.diff===0?'hoje':'proximo'}">
            ${f.diff<0?`h\u00E1 ${-f.diff}d`:f.diff===0?'hoje':`em ${f.diff}d`}
          </div>
        </div>
      `).join('')}
    </div>`;
  };

  let html = '';
  if(!vencidos.length && !hoje.length && !proximos.length){
    html = '<div class="empty-state" style="margin-top:40px">Nenhum follow-up pendente. Tudo em dia!</div>';
  } else {
    html += renderGroup('&#9888; Vencidos', vencidos, 'var(--red)');
    html += renderGroup('Hoje', hoje, '#92400e');
    html += renderGroup('&#10003; Pr\u00F3ximos 3 dias', proximos, 'var(--green2)');
  }
  document.getElementById('alertas-content').innerHTML = html;
}

// ==================== WEEKLY TAB ====================
function renderWeekly(){
  const now = today();
  const thisWeek = isoToWeekStart(now);
  const lastWeek = isoToWeekStart(addDays(thisWeek,-1));

  const inWeek = (lead, week) => lead.semana === week;
  const contactadoInWeek = (lead, week) => {
    return lead.canal_hist && lead.canal_hist.some(h => isoToWeekStart(h.data) === week);
  };

  const tw = leads.filter(l=>inWeek(l,thisWeek));
  const lw = leads.filter(l=>inWeek(l,lastWeek));
  const twC = leads.filter(l=>contactadoInWeek(l,thisWeek));
  const lwC = leads.filter(l=>contactadoInWeek(l,lastWeek));
  const twR = leads.filter(l=>l.status==='Respondeu' && l.ultimo && isoToWeekStart(l.ultimo)===thisWeek);
  const lwR = leads.filter(l=>l.status==='Respondeu' && l.ultimo && isoToWeekStart(l.ultimo)===lastWeek);
  const twP = leads.filter(l=>l.status==='Parceiro');
  const prontos = leads.filter(l=>l.status==='Novo' && readinessScore(l).score>=80);

  const pct = (a,b) => b?Math.round(a/b*100):0;

  const canalDist = {};
  CANAIS.forEach(c=>canalDist[c]=0);
  twC.forEach(l=>{ if(l.canal_ativo) canalDist[l.canal_ativo]=(canalDist[l.canal_ativo]||0)+1; });

  const weeks = [];
  for(let i=5;i>=0;i--){
    const ws = isoToWeekStart(addDays(thisWeek,-i*7));
    const count = leads.filter(l=>l.semana===ws).length;
    weeks.push({ws, count, label: formatDate(ws)});
  }
  const maxCount = Math.max(1,...weeks.map(w=>w.count));

  let html = `
    <div class="weekly-grid">
      <div class="weekly-stat"><div class="weekly-stat-num">${tw.length}</div><div class="weekly-stat-label">Adicionados</div><div class="weekly-stat-sub">vs ${lw.length} semana ant.</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num">${twC.length}</div><div class="weekly-stat-label">Contatados</div><div class="weekly-stat-sub">vs ${lwC.length} semana ant.</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num">${twR.length}</div><div class="weekly-stat-label">Responderam</div><div class="weekly-stat-sub">vs ${lwR.length} semana ant.</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num">${twP.length}</div><div class="weekly-stat-label">Parceiros</div><div class="weekly-stat-sub">total</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num">${pct(twC.length,tw.length)}%</div><div class="weekly-stat-label">Convers\u00E3o</div><div class="weekly-stat-sub">contatados/adicionados</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num">${pct(twR.length,twC.length)}%</div><div class="weekly-stat-label">Resposta</div><div class="weekly-stat-sub">responderam/contatados</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num">${prontos.length}</div><div class="weekly-stat-label">Prontos</div><div class="weekly-stat-sub">score &ge; 80%</div></div>
      <div class="weekly-stat"><div class="weekly-stat-num">${leads.filter(l=>l.canal_ativo).length}</div><div class="weekly-stat-label">Canais ativos</div><div class="weekly-stat-sub">leads com canal</div></div>
    </div>

    <div class="weekly-chart">
      <div style="font-weight:700;font-size:13px">Leads adicionados por semana</div>
      <div class="chart-bars">
        ${weeks.map(w=>`
          <div class="chart-bar-wrap">
            <div class="chart-val">${w.count||''}</div>
            <div class="chart-bar" style="height:${Math.round(w.count/maxCount*80)+4}px"></div>
            <div class="chart-label">${w.label}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="weekly-btns">
      <button class="btn-sm" onclick="gerarResumoWeekly()">Resumo &#8594;</button>
      <button class="btn-sm" onclick="gerarSlideWeekly()">Slide &#8594;</button>
    </div>

    <div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">Canal ativo esta semana</div>
      ${CANAIS.map(c=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <div style="width:80px;font-size:13px">${CANAL_ICONS[c]} ${CANAL_LABELS[c]}</div>
          <div style="flex:1;height:12px;background:var(--bg);border-radius:6px;overflow:hidden">
            <div style="height:100%;background:var(--green);border-radius:6px;width:${twC.length?Math.round((canalDist[c]||0)/twC.length*100):0}%"></div>
          </div>
          <div style="font-size:12px;color:var(--muted);width:20px">${canalDist[c]||0}</div>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('weekly-content').innerHTML = html;
}

function gerarResumoWeekly(){
  const tw = leads.filter(l=>l.semana===isoToWeekStart(today()));
  const prompt = `Resumo semanal CRM Prax - ${formatDate(isoToWeekStart(today()))}\nAdicionados: ${tw.length}\nParceiros: ${leads.filter(l=>l.status==='Parceiro').length}\nProntos: ${leads.filter(l=>l.status==='Novo'&&readinessScore(l).score>=80).length}\n\nEscreva um resumo executivo de 3 bullets para uso interno da equipe de vendas.`;
  showModal('Prompt: Resumo Semanal', prompt);
}

function gerarSlideWeekly(){
  const prompt = `Gere o conte\u00FAdo de um slide de resultados da semana para o CRM Prax:\n- T\u00EDtulo, subt\u00EDtulo, 3-4 KPIs principais, 1 insight e pr\u00F3ximo passo.\n- Formato limpo para apresenta\u00E7\u00E3o executiva.`;
  showModal('Prompt: Slide Semanal', prompt);
}

    {emoji:'SP', label:'Gestores - S\u00E3o Paulo', sub:'S\u00E3o Paulo capital e grande SP', prompt:`Gere 10 leads de gestores de tr\u00E1fego e performance de S\u00E3o Paulo. Formato: EMPRESA | DECISOR | CARGO | IG_EMP | LI_EMP | IG_DEC | LI_DEC | CIDADE | CONTEXTO. Use - para campos n\u00E3o verific\u00E1veis.`},
    {emoji:'CO', label:'Consultorias - Brasil', sub:'consultores e-commerce Brasil', prompt:`Gere 10 leads de consultorias de e-commerce no Brasil. Formato: EMPRESA | DECISOR | CARGO | IG_EMP | LI_EMP | IG_DEC | LI_DEC | CIDADE | CONTEXTO. Use - para campos n\u00E3o verific\u00E1veis.`},
    {emoji:'NE', label:'Gestores - Nordeste', sub:'BA, PE, CE, MA, outros', prompt:`Gere 10 leads de gestores de tr\u00E1fego e ag\u00EAncias de performance no Nordeste do Brasil. Formato: EMPRESA | DECISOR | CARGO | IG_EMP | LI_EMP | IG_DEC | LI_DEC | CIDADE | CONTEXTO. Use - para campos n\u00E3o verific\u00E1veis.`},
  ];

  let html = aviso;
  html += `<div class="prospectar-nota">Decisores verific\u00E1veis, sem handles inventados. IG e LI chegam como - para editar diretamente no lead ap\u00F3s importar.</div>`;

  html += `<h4 style="font-size:13px;font-weight:700;margin-bottom:10px">Sess\u00F5es r\u00E1pidas</h4>
    <div class="sessao-grid">
      ${sessoes.map((s,i)=>`
        <button class="sessao-btn" onclick="gerarSessaoPrompt(${i})">
          <span style="font-size:16px">${s.emoji}</span>
          <strong>${s.label}</strong>
          <span>${s.sub}</span>
        </button>
      `).join('')}
    </div>`;

  html += `<div style="margin-bottom:16px">
    <h4 style="font-size:13px;font-weight:700;margin-bottom:8px">Pedido livre</h4>
    <div style="display:flex;gap:8px">
      <input id="livre-input" class="form-input" style="flex:1" placeholder="Ex: 5 gestores de tr\u00E1fego em BH especializados em moda">
      <button class="btn-sm btn-primary" onclick="gerarLivrePrompt()">Prospectar &#8594;</button>
    </div>
  </div>`;

  html += `<div class="import-area">
    <h4>Importar leads</h4>
    <p>Cole os dados no formato: <code>EMPRESA | DECISOR | CARGO | IG_EMP | LI_EMP | IG_DEC | LI_DEC | CIDADE | CONTEXTO</code><br>Use <code>-</code> para campos em branco. Uma linha por lead.</p>
    <textarea id="import-textarea" class="import-textarea" placeholder="Ag\u00EAncia XYZ | Jo\u00E3o Silva | CEO | agenciaxyz | agenciaxyz | joaosilva.ec | in/joaosilva | S\u00E3o Paulo/SP | Especializada em moda"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn-sm btn-primary" onclick="importarLeads()">Importar</button>
      <button class="btn-sm" onclick="document.getElementById('import-textarea').value=''">Limpar</button>
    </div>
    <div id="import-result"></div>
  </div>`;

  document.getElementById('prospectar-content').innerHTML = html;
  window._sessaoPrompts = sessoes.map(s=>s.prompt);
}

function gerarSessaoPrompt(i){
  showModal('Prompt: Prospec\u00E7\u00E3o', window._sessaoPrompts[i]);
}

function gerarLivrePrompt(){
  const txt = document.getElementById('livre-input').value.trim();
  if(!txt) return;
  const prompt = `Gere leads para prospec\u00E7\u00E3o no CRM Prax com o seguinte crit\u00E9rio: ${txt}.\nFormato: EMPRESA | DECISOR | CARGO | IG_EMP | LI_EMP | IG_DEC | LI_DEC | CIDADE | CONTEXTO\nUse - para campos n\u00E3o verific\u00E1veis. Sem handles inventados.`;
  showModal('Prompt: Prospec\u00E7\u00E3o Livre', prompt);
}

function importarLeads(){
  const txt = document.getElementById('import-textarea').value.trim();
  if(!txt){ document.getElementById('import-result').innerHTML='<div class="import-result import-err">Cole os dados antes de importar.</div>'; return; }
  const lines = txt.split('\n').filter(l=>l.trim());
  let ok=0, errs=[];
  const w = isoToWeekStart(today());
  lines.forEach((line,i)=>{
    const parts = line.split('|').map(p=>p.trim());
    if(parts.length<9){ errs.push(`Linha ${i+1}: formato inv\u00E1lido (${parts.length} campos)`); return; }
    const [nome,contato,cargo,ig,li,ig_decisor,li_decisor,cidade,contexto] = parts;
    const clean = v => (v==='-'||v==='\u2014'||v==='') ? '' : v;
    const lead = {
      id: Date.now()+Math.random()*1000|0,
      nome:clean(nome)||'Sem nome', contato:clean(contato), cargo:clean(cargo),
      ig:clean(ig), li:clean(li), ig_decisor:clean(ig_decisor), li_decisor:clean(li_decisor),
      ig_validado:false, li_validado:false, wa:'', cidade:clean(cidade), seg:'Ag\u00EAncia e-commerce',
      status:'Novo', pot:3, contexto:clean(contexto), gancho:'',
      canal_ativo:null, canal_hist:[], canal_follows:{wa:{},ig:{},li:{},dm:{}},
      data1:'', ultimo:'', follows:0,
      comments:[{date:today(), text:'Importado. Editar e validar IG/LI antes de contatar.'}],
      fonte:'IA', semana:w
    };
    leads.push(lead);
    ok++;
  });
  save();
  const msg = `${ok} lead${ok!==1?'s':''} importado${ok!==1?'s':''}${errs.length?` (${errs.length} erro${errs.length>1?'s':''})`:''}.`;
  document.getElementById('import-result').innerHTML = `<div class="import-result ${errs.length?'import-err':'import-ok'}">${msg}${errs.length?'<br>'+errs.join('<br>'):''}</div>`;
  if(ok) document.getElementById('import-textarea').value='';
}

// ==================== NOVO LEAD FORM ====================

function salvarNovoLead(){
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome){ document.getElementById('novo-result').innerHTML='<div style="color:var(--red);font-size:13px">Nome da empresa \u00E9 obrigat\u00F3rio.</div>'; return; }
  const w = isoToWeekStart(today());
  const lead = {
    id: Date.now(),
    nome, contato: document.getElementById('f-contato').value.trim(),
    cargo: document.getElementById('f-cargo').value.trim(),
    ig: document.getElementById('f-ig').value.trim(),
    li: document.getElementById('f-li').value.trim(),
    ig_decisor: document.getElementById('f-ig-dec').value.trim(),
    li_decisor: document.getElementById('f-li-dec').value.trim(),
    ig_validado:false, li_validado:false,
    wa: document.getElementById('f-wa').value.trim().replace(/\D/g,''),
    cidade: document.getElementById('f-cidade').value.trim(),
    seg: document.getElementById('f-seg').value,
    status:'Novo', pot:parseInt(document.getElementById('f-pot').value),
    contexto: document.getElementById('f-contexto').value.trim(),
    gancho: document.getElementById('f-gancho').value.trim(),
    canal_ativo:null, canal_hist:[], canal_follows:{wa:{},ig:{},li:{},dm:{}},
    data1:'', ultimo:'', follows:0, comments:[],
    fonte: document.getElementById('f-fonte').value,
    semana: w
  };
  leads.push(lead);
  save();
  document.getElementById('novo-result').innerHTML='<div style="color:var(--green);font-size:13px">Lead salvo com sucesso!</div>';
  setTimeout(()=>{ openDetail(lead.id); }, 800);
}

function limparNovoForm(){ renderNovoForm(); }

// ==================== TABS ====================
function showTab(tab){
  activeTab = tab;
  save();
  document.querySelectorAll('.tab-content').forEach(el=>el.style.display='none');
  document.getElementById('detail-view').style.display='none';
  document.querySelectorAll('#tabs .tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tab===tab);
  });

  const el = document.getElementById('tab-'+tab);
  if(el) el.style.display='block';

  if(tab==='pipeline') renderPipeline();
  else if(tab==='prontos') renderProntos();
  else if(tab==='alertas') renderAlertas();
  else if(tab==='weekly') renderWeekly();
  else if(tab==='prospectar') renderProspectar();
  else if(tab==='novo') renderNovoForm();
}

function renderAll(){
  const tab = activeTab;
  if(tab==='pipeline') renderPipeline();
  else if(tab==='prontos') renderProntos();
  else if(tab==='alertas') renderAlertas();
  else if(tab==='weekly') renderWeekly();
  else if(tab==='prospectar') renderProspectar();
}

// ==================== MODAL ====================
function showModal(title, text){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').value = text;
  document.getElementById('prompt-modal').classList.add('show');
}
function closeModal(){
  document.getElementById('prompt-modal').classList.remove('show');
}
function copyPrompt(){
  const t = document.getElementById('modal-text');
  t.select(); document.execCommand('copy');
  const btn = document.querySelector('#prompt-modal .btn-sm');
  btn.textContent='Copiado!';
  setTimeout(()=>btn.textContent='Copiar',1500);
}
document.getElementById('prompt-modal').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

// ==================== UTILS ====================
function esc(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ==================== EXPORT / IMPORT ====================
function exportarDados(){
  const data = JSON.stringify({leads}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `crm_prax_${today()}.json`;
  a.click();
}

function importarDados(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(!d.leads || !Array.isArray(d.leads)) throw new Error('Formato inv\u00E1lido');
      if(!confirm(`Importar ${d.leads.length} leads? Os dados atuais ser\u00E3o substitu\u00EDdos.`)) return;
      leads = d.leads;
      save();
      renderAll();
      showTab(activeTab);
      alert(`${leads.length} leads importados com sucesso.`);
    } catch(err){
      alert('Erro ao importar: ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

load();
showTab(activeTab);
